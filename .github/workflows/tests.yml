# Based on the workflow `brew tap-new` generates (Homebrew 7.0.12). Actions
# are pinned to commit SHAs; Dependabot (.github/dependabot.yml) proposes
# updates. The comment after each SHA is the release it maps to.
name: brew test-bot

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # Mondays at 06:00 UTC: catches changes in Homebrew, compilers and runner
    # images that break the formula without any change here
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  test-bot:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS 26 (arm64)
            os: macos-26
          - name: macOS 15 (arm64)
            os: macos-15
          - name: Linux (x86_64)
            os: ubuntu-latest
            container:
              image: ghcr.io/homebrew/brew:main
              options: --privileged
          - name: Linux (arm64)
            os: ubuntu-24.04-arm
            container:
              image: ghcr.io/homebrew/brew:main
              options: --privileged
    runs-on: ${{ matrix.os }}
    container: ${{ fromJSON(toJSON(matrix.container)) }} # zizmor: ignore[unpinned-images]
    timeout-minutes: 45
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@c262868c096d909fc278daa87ed9772967331ea3 # 2026.11.02.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax

      # Builds a bottle of each changed formula (for the oldest supported
      # CPU), then tests and audits it
      - run: brew test-bot --only-formulae
        if: github.event_name == 'pull_request'

      - name: Upload bottles as artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bottles_${{ matrix.os }}
          path: '*.bottle.*'

      # What `brew install --build-from-source` does on a user's machine (and
      # `brew install` where there is no bottle): a build for the runner's
      # own CPU (-march=native), which the bottle build above does not cover.
      # Each formula in turn: ss-lib@2 is keg-only, but both install the
      # same files, so only one is installed at a time here
      - name: Install from source, test and audit
        run: |
          for formula in ss-lib ss-lib@2; do
            f="dardevelin/ss-lib/$formula"
            if brew list --formula "$f" > /dev/null 2>&1; then
              brew uninstall --formula "$f"
            fi
            brew install --build-from-source "$f"
            brew test "$f"
            brew audit --strict --online "$f"
            brew uninstall --formula "$f"
          done

      # ss_lib's main branch with the ss-lib formula: a change there that breaks
      # the formula fails here before it is released
      - name: Install the development version (--HEAD) and test it
        run: |
          brew install --HEAD dardevelin/ss-lib/ss-lib
          brew test dardevelin/ss-lib/ss-lib
          brew uninstall --formula dardevelin/ss-lib/ss-lib
