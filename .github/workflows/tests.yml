name: probe
on:
  pull_request:
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-24.04-arm
    container:
      image: ghcr.io/homebrew/brew:main
    permissions:
      contents: read
    steps:
      - name: What -march=native means here, and 2.2.2 vs 2.2.3 built as Homebrew does
        shell: bash -xeuo pipefail {0}
        run: |
          grep -m1 -iE 'CPU part|model name' /proc/cpuinfo || true
          grep -m1 Features /proc/cpuinfo
          for cc in gcc-13 gcc; do command -v $cc && $cc --version | head -1 && $cc -march=native -Q --help=target | grep -E '^\s+-march=|^\s+-mcpu=' || true; done
          echo | gcc-13 -march=native -mbranch-protection=standard -dM -E - | grep -E 'PAUTH|PAC_DEFAULT|JCVT|__ARM_ARCH ' || true
          cd "$RUNNER_TEMP"
          for v in 2.2.2 2.2.3; do
            curl -sSL "https://github.com/dardevelin/ss_lib/releases/download/v$v/ss_lib-v$v.tar.gz" | tar -xz
            cd "ss_lib-v$v"
            gcc-13 -O2 -march=native -mbranch-protection=standard -std=c11 -Iinclude -DSS_ENABLE_THREAD_SAFETY=1 -DSS_ENABLE_PERFORMANCE_STATS=1 -c src/ss_lib.c -o l.o
            echo "$v retaa: $(objdump -d l.o | grep -c retaa || true)"
            gcc-13 -std=c11 -Iinclude -DSS_ENABLE_THREAD_SAFETY=1 -DSS_ENABLE_PERFORMANCE_STATS=1 tests/test_simple.c l.o -pthread -o t
            ./t > /dev/null && echo "$v: test passed" || echo "$v: test FAILED ($?)"
            cd ..
          done
